# Gradle 데몬 JVM 설정
#
# file.encoding=MS949 가 필요한 이유:
# 사용자 홈 경로에 한글(C:\Users\이제영\...)이 포함되어 있어, Gradle이 워커 프로세스에
# 클래스패스를 넘길 때 쓰는 @argfile 의 인코딩이 데몬 JVM과 워커 JVM 사이에서 어긋납니다.
# (데몬 JDK = UTF-8 기본값 / 워커 JDK 17 = 윈도우 기본 MS949)
# 그 결과 경로가 깨져 "GradleWorkerMain 을 찾거나 로드할 수 없습니다" 오류가 납니다.
# 데몬 인코딩을 윈도우 기본값과 맞추면 해결됩니다.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=MS949
